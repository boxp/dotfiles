# armv7l (Sharp IS01) 専用の status 設定。.tmux.conf から source-file される。
#
# ここで battery を出さないのが要点。
#
# tmux-battery は status-right の #{battery_*} をプラグイン読み込み時に
# #(スクリプト) へ書き換えるので、1 描画あたり 4 本のシェルが起動する。
# IS01 は /sys/class/power_supply/ が空なので、スクリプトは毎回すべての検出方式を
# 順に試して全部空振りする。998MHz の ARMv7 では 1 描画が status-interval を
# 超え、描画が積み上がって暴走する。
#
# 実測 (IS01 実機、15 秒あたりの fork 数と CPU アイドル率):
#
#   元の設定            fork=1237  idle= 0.0%   <- CPU が一度も休まない
#   continuum を外す    fork=1205  idle= 0.0%   <- 無罪
#   ccusage を外す      fork=1227  idle= 0.0%   <- 無罪
#   battery を外す      fork= 182  idle=81.8%   <- 犯人
#   さらに interval 30  fork=  89  idle=89.9%
#
# 一度この状態に落ちると、負荷が去っても描画の滞留が自然には解けない。
# load average が 11 を超えたまま何十分も戻らなくなる。
#
# 電池残量が読めるようになったら (BOXP-163) 検出が一発で当たるので、
# そのときに battery の復活を再検討する。

set-option -g status-interval 30
set -g status-right '#(~/ghq/github.com/boxp/dotfiles/scripts/ccusage-status.sh) | %Y-%m-%d %H:%M'
