# BOXP-193: dotfiles advisory pilot の設定案（未導入・dry-run 評価専用）。
# files はここに書かない。dry-run-eval.sh が allowlist.txt のうち gate を通った
# path だけを files として生成する（許可リストは allowlist.txt の1箇所だけ）。
# gate (dry-run-eval.sh) が一次防御。ここは jev-lint 側の二重の除外。
exclude:
  - "**/.env*"
  - "**/.ssh"
  - "**/*.pem"
  - "**/*.key"
  - "**/*kubeconfig*"
  - "**/*.tfvars*"
  - "**/*.tfstate*"
  - "**/*.tfplan"
  - "**/.terraform"
  - "**/inventories"
  - "**/group_vars"
  - "**/fixtures"
  - "**/*.log"
  - "**/*.jsonl"
# 明示した rule だけが動く（rules: があると既定 pack は動かない）。
rules:
  shell/destroys-beyond-its-scope: on
  markdown/agent-instruction-is-unclear: on
  markdown/agent-instructions-conflict: on
cache: none
